name: prepublish-guard
description: Find secrets and personal data in a repository's files and git history; upload SARIF to code scanning.
branding: { icon: shield, color: green }
inputs:
  history:
    description: "Also scan the full git history (needs actions/checkout with fetch-depth: 0)"
    default: "true"
  fail-on:
    description: "low | medium | high | never (default: fail_on from .prepublish-guard.toml, else medium)"
    default: ""
  upload-sarif:
    description: "Upload results to GitHub code scanning"
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v6
      with: { python-version: "3.12" }
    - shell: bash
      env: { ACTION_PATH: "${{ github.action_path }}" }
      run: pip install "$ACTION_PATH"
    - id: scan
      shell: bash
      env:                                   # inputs reach the script as data, never as shell code
        WORKSPACE: ${{ github.workspace }}
        HISTORY: ${{ inputs.history }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        args=(scan "$WORKSPACE" --format sarif --output prepublish-guard.sarif --fail-on never)
        [ "$HISTORY" = "true" ] && args+=(--history)
        prepublish-guard "${args[@]}"
        check=(scan "$WORKSPACE")
        [ "$HISTORY" = "true" ] && check+=(--history)
        [ -n "$FAIL_ON" ] && check+=(--fail-on "$FAIL_ON")
        prepublish-guard "${check[@]}"
    - if: always() && inputs.upload-sarif == 'true' && hashFiles('prepublish-guard.sarif') != ''
      uses: github/codeql-action/upload-sarif@v4
      with: { sarif_file: prepublish-guard.sarif, category: prepublish-guard }
