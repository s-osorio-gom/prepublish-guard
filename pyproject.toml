[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prepublish-guard"
version = "0.1.0"
description = "Find secrets, personal data (incl. Colombian formats) and other things that must not be published, in a repository's files and its git history."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Santiago Osorio" }]
keywords = ["security", "secrets", "pii", "git", "pre-commit", "privacy", "sarif"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Topic :: Security",
  "Topic :: Software Development :: Version Control :: Git",
  "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/s-osorio-gom/prepublish-guard"
Issues = "https://github.com/s-osorio-gom/prepublish-guard/issues"
Changelog = "https://github.com/s-osorio-gom/prepublish-guard/blob/main/CHANGELOG.md"

[project.scripts]
prepublish-guard = "prepublish_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
